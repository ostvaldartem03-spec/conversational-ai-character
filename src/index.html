<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Ded Moroz — Portfolio Reconstruction</title>
  <style>
    :root { --bg:#000; --gold:#ffd700; --ice:#00f3ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#fff; height:100vh; overflow:hidden; font-family:Arial,sans-serif; }
    #viewport,.video-layer,#hud,#curtain { position:absolute; inset:0; }
    .video-layer { width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .45s ease; }
    .video-layer.active { opacity:1; }
    #hud { pointer-events:none; background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.75) 120%); }
    .status { position:absolute; top:24px; left:24px; font:12px monospace; letter-spacing:2px; color:#bbb; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; background:#444; }
    .dot.listening { background:var(--ice); box-shadow:0 0 16px var(--ice); }
    .dot.processing { background:var(--gold); box-shadow:0 0 16px var(--gold); }
    .dot.speaking { background:#fff; box-shadow:0 0 16px #fff; }
    #subs { position:absolute; left:10%; right:10%; bottom:12%; text-align:center; font-size:28px; text-shadow:0 4px 20px #000; }
    #logs { position:absolute; top:65px; left:24px; width:420px; max-height:300px; overflow:hidden; font:11px monospace; color:#aaa; }
    #curtain { z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:#000; transition:background .3s ease; }
    #curtain.demo-mode { justify-content:flex-end; padding-bottom:22px; background:linear-gradient(to top,rgba(0,0,0,.72),transparent 28%); pointer-events:none; }
    #curtain.demo-mode .brand,
    #curtain.demo-mode input,
    #curtain.demo-mode select,
    #curtain.demo-mode #start,
    #curtain.demo-mode .note { display:none; }
    #curtain.demo-mode .demo { pointer-events:auto; }
    .brand { color:var(--gold); font-size:28px; font-weight:800; letter-spacing:3px; margin-bottom:8px; }
    input,select,button { width:250px; padding:12px; background:#090909; color:var(--gold); border:1px solid var(--gold); }
    button { cursor:pointer; font-weight:700; letter-spacing:1.5px; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .demo { display:flex; gap:8px; margin-top:10px; }
    .demo button { width:auto; min-width:108px; padding:9px 12px; font-size:11px; }
    .note { max-width:420px; margin-top:8px; font:10px/1.5 monospace; color:#666; text-align:center; }
  </style>
</head>
<body>
  <div id="viewport">
    <video id="v1" class="video-layer" muted playsinline></video>
    <video id="v2" class="video-layer" muted playsinline></video>
  </div>

  <div id="hud">
    <div class="status"><span id="dot" class="dot"></span><span id="status">PUBLIC RECONSTRUCTION</span></div>
    <div id="logs"></div>
    <div id="subs"></div>
  </div>

  <div id="curtain">
    <div class="brand">AI DED MOROZ</div>
    <input id="name" placeholder="ИМЯ" autocomplete="off" />
    <select id="gender"><option>мальчик</option><option>девочка</option></select>
    <button id="start" disabled>LIVE AI MODE — PRIVATE BACKEND</button>
    <div class="demo">
      <button data-demo="16s_3">МАГИЯ</button>
      <button data-demo="16s_9">КОСМОС</button>
      <button data-demo="16s_11">ПОДАРОК</button>
    </div>
    <div class="note">SANITIZED PORTFOLIO RECONSTRUCTION<br>Generated-media demos are public. Live STT / LLM / TTS provider backends are intentionally omitted.</div>
  </div>

  <script src="./video-library.js"></script>
  <script>
    const CONFIG = {
      liveBackend: false,
      api: {
        transcribe: '/api/transcribe',
        strategize: '/api/strategy',
        tts: '/api/tts'
      }
    };

    const CHILD = { name: 'Друг', gender: 'мальчик' };
    const VIDEOS = window.VIDEO_LIBRARY || { ZERO:'', INTRO:'', REACTIONS:[], LIBRARY:[] };

    const UI = {
      state(text, cls='') {
        document.querySelector('#status').textContent = text;
        document.querySelector('#dot').className = `dot ${cls}`;
      },
      subtitle(text='') { document.querySelector('#subs').textContent = text; },
      log(source, text) {
        const row = document.createElement('div');
        row.textContent = `[${source}] ${text}`;
        document.querySelector('#logs').prepend(row);
      }
    };

    const VIDEO = {
      layers:[document.querySelector('#v1'),document.querySelector('#v2')],
      active:0,
      current:null,
      find(id) {
        return [...VIDEOS.REACTIONS, ...VIDEOS.LIBRARY].find(item => item.id === id);
      },
      src(id) {
        if (id === 'INTRO') return VIDEOS.INTRO;
        if (id === 'ZERO') return VIDEOS.ZERO;
        return this.find(id)?.src || VIDEOS.ZERO;
      },
      setSource(video, src) {
        if (!src) return false;
        if (video.getAttribute('src') !== src) {
          video.setAttribute('src', src);
          video.load();
        }
        return true;
      },
      init() {
        this.layers.forEach(v => this.setSource(v, VIDEOS.ZERO));
      },
      async play(id, loop=true) {
        if (id === 'ZERO' && this.current === 'ZERO') return;
        const nextIndex = this.active === 0 ? 1 : 0;
        const next = this.layers[nextIndex];
        const current = this.layers[this.active];
        const src = this.src(id);
        if (!this.setSource(next, src)) return;
        next.loop = loop;
        try {
          await next.play();
          next.classList.add('active');
          current.classList.remove('active');
          current.pause();
          this.active = nextIndex;
          this.current = id;
        } catch (err) {
          UI.log('MEDIA', `Unable to play ${id}`);
          console.warn('Video unavailable in public build', err);
        }
      },
      preload(id) {
        const next = this.layers[this.active === 0 ? 1 : 0];
        this.setSource(next, this.src(id));
      }
    };

    async function postJSON(url, body) {
      if (!CONFIG.liveBackend) throw new Error('Private backend is not included in this public reconstruction');
      const r = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if (!r.ok) throw new Error(`${url}: ${r.status}`);
      return r.json();
    }

    const NEURAL = {
      async hear(blob) {
        if (!CONFIG.liveBackend) return null;
        const form = new FormData();
        form.append('file', blob, 'voice.webm');
        try {
          const r = await fetch(CONFIG.api.transcribe, { method:'POST', body:form });
          if (!r.ok) throw new Error(`STT ${r.status}`);
          return (await r.json()).text || null;
        } catch (err) {
          console.warn('STT unavailable', err);
          return null;
        }
      },
      async reflex(text) {
        const s = text.toLowerCase();
        if (s.includes('привет')) return { text:'Охо-хо! Рад тебя слышать!', video_id:'8s_1' };
        if (s.includes('волшеб')) return { text:'Волшебство? Вот это хороший вопрос!', video_id:'8s_5' };
        if (s.includes('груст') || s.includes('плохо')) return { text:'Я тебя внимательно слушаю.', video_id:'8s_8' };
        return { text:'Охо-хо, слушаю тебя внимательно.', video_id:'8s_9' };
      },
      async strategize(userText, reflexText) {
        try {
          const data = await postJSON(CONFIG.api.strategize, {
            userText,
            reflexText,
            child:CHILD,
            availableVideos: VIDEOS.LIBRARY.map(({id,tags}) => ({id,tags}))
          });
          return Array.isArray(data.chain) ? data.chain : [];
        } catch (err) {
          console.warn('LLM unavailable', err);
          return [];
        }
      },
      async speak(text) {
        try {
          const data = await postJSON(CONFIG.api.tts, { text });
          return data.audio_url || null;
        } catch (err) {
          console.warn('TTS unavailable', err);
          return null;
        }
      }
    };

    const CORE = {
      audioCtx:null,
      running:false,
      async start() {
        if (!CONFIG.liveBackend) {
          UI.state('LIVE BACKEND OMITTED');
          UI.log('SYS','Live STT / LLM / TTS mode is intentionally unavailable in the public reconstruction.');
          return;
        }

        const name = document.querySelector('#name').value.trim();
        if (!name) return alert('Введи имя!');
        CHILD.name = name;
        CHILD.gender = document.querySelector('#gender').value;

        document.querySelector('#curtain').remove();
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        VIDEO.init();
        await this.playBlock('ZERO', `Охо-хо! Здравствуй, ${CHILD.name}! Я Дед Мороз. Рад тебя видеть!`);
        this.listen();
      },
      async demo(videoId) {
        const item = VIDEO.find(videoId);
        document.querySelector('#curtain')?.classList.add('demo-mode');
        VIDEO.init();
        UI.state('MEDIA DEMO','speaking');
        UI.subtitle(item ? item.tags : videoId);
        UI.log('DEMO', `semantic route -> ${videoId}`);
        await VIDEO.play(videoId, true);
      },
      async execute(blob) {
        if (this.running || !CONFIG.liveBackend) return;
        this.running = true;
        UI.state('PROCESSING','processing');

        const text = await NEURAL.hear(blob);
        if (!text) return this.finish();
        UI.log('USR', text);

        const reflex = await NEURAL.reflex(text);
        const reflexAudioPromise = NEURAL.speak(reflex.text);
        const planPromise = NEURAL.strategize(text, reflex.text);

        const reflexAudio = await reflexAudioPromise;
        const reflexPlayback = this.playBlock(reflex.video_id || 'ZERO', reflex.text, reflexAudio);
        UI.log('AI', `[REFLEX] ${reflex.text}`);

        let chain = [];
        try { chain = await planPromise; } catch (_) {}

        const audioPromises = chain.map(block => NEURAL.speak(block.text));
        if (chain[0]) VIDEO.preload(chain[0].video_id);
        await reflexPlayback;

        for (let i=0; i<chain.length; i++) {
          const block = chain[i];
          if (chain[i+1]) VIDEO.preload(chain[i+1].video_id);
          const audio = await audioPromises[i];
          UI.log('AI', `[CHAIN ${i+1}] ${block.video_id} · ${block.text}`);
          await this.playBlock(block.video_id, block.text, audio);
        }
        this.finish();
      },
      async playBlock(videoId, text, audioUrl=null) {
        UI.state('SPEAKING','speaking');
        UI.subtitle(text);
        VIDEO.play(videoId, true);

        const url = audioUrl || await NEURAL.speak(text);
        if (!url) return new Promise(r => setTimeout(r, 900));

        return new Promise(resolve => {
          const audio = new Audio(url);
          audio.onended = resolve;
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      },
      listen() {
        if (!CONFIG.liveBackend) return;
        UI.subtitle('');
        UI.state('LISTENING','listening');
        VIDEO.play('ZERO', true);
        VAD.start();
      },
      finish() {
        this.running = false;
        this.listen();
      }
    };

    const VAD = {
      listening:false,
      stream:null,
      source:null,
      analyser:null,
      recorder:null,
      data:null,
      chunks:[],

      async ensureMedia() {
        if (this.stream?.active && this.analyser && this.recorder) return;
        this.stream = await navigator.mediaDevices.getUserMedia({audio:true});
        this.source = CORE.audioCtx.createMediaStreamSource(this.stream);
        this.analyser = CORE.audioCtx.createAnalyser();
        this.analyser.fftSize = 512;
        this.source.connect(this.analyser);
        this.data = new Uint8Array(this.analyser.frequencyBinCount);
        this.recorder = new MediaRecorder(this.stream);
        this.recorder.ondataavailable = e => this.chunks.push(e.data);
      },

      async start() {
        if (this.listening || !CONFIG.liveBackend) return;
        try {
          await this.ensureMedia();
          this.listening = true;
          let speaking = false;
          let silenceSince = Date.now();

          const tick = () => {
            if (!this.listening) return;
            this.analyser.getByteFrequencyData(this.data);
            const volume = this.data.reduce((a,b) => a+b, 0) / this.data.length;

            if (volume > 20) {
              silenceSince = Date.now();
              if (!speaking) {
                speaking = true;
                this.chunks = [];
                if (this.recorder.state === 'inactive') this.recorder.start();
                UI.state('DETECTING','listening');
              }
            } else if (speaking && Date.now() - silenceSince > 1000) {
              this.listening = false;
              if (this.recorder.state !== 'inactive') this.recorder.stop();
              this.recorder.onstop = () => CORE.execute(new Blob(this.chunks,{type:'audio/webm'}));
              return;
            }
            requestAnimationFrame(tick);
          };
          tick();
        } catch (err) {
          this.listening = false;
          UI.log('SYS','MIC ERROR — HTTPS / permission required');
        }
      },

      stop() {
        this.listening = false;
        if (this.recorder?.state !== 'inactive') this.recorder.stop();
        this.stream?.getTracks().forEach(track => track.stop());
        this.stream = null;
        this.source = null;
        this.analyser = null;
        this.recorder = null;
        this.data = null;
      }
    };

    document.querySelector('#start').addEventListener('click', () => CORE.start());
    document.querySelectorAll('[data-demo]').forEach(button => {
      button.addEventListener('click', () => CORE.demo(button.dataset.demo));
    });
    window.addEventListener('beforeunload', () => VAD.stop());
  </script>
</body>
</html>
